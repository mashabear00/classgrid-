services:
  - type: web
    name: classgrid-scheduler
    runtime: node
    plan: free
    rootDir: render-app
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: classgrid-database
          property: connectionString

databases:
  - name: classgrid-database
    plan: free
    databaseName: classgrid
    user: classgrid_user
